<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Инвест Привет+ · Инвест-часы и фундаментал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--blue:#1F5CFF;--lime:#B6F03A;--navy:#0F2042;--canvas:#F8FAFC;--surface:#FFFFFF;--up:#15803D;--down:#DC2626;--downText:#B91C1C;--sec:#475569;--muted:#64748B;--border:#E2E8F0;--upBg:#DCFCE7;--downBg:#FEE2E2;--blueBg:#DCE6FF;--soft:#F1F5FF}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--canvas);color:var(--navy);font-size:15px;line-height:1.45}
a{color:var(--blue);text-decoration:none}
button{font:inherit}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.bar{max-width:1280px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.logo{font-weight:800;font-size:21px;display:flex;align-items:center;gap:10px;color:#fff}
.logo i{font-style:normal;width:32px;height:32px;border-radius:9px;background:var(--blue);display:grid;place-items:center;font-size:14px}
.logo b{color:var(--lime);margin-left:-4px}
nav{display:flex;gap:24px;font-weight:600;font-size:15px}
nav a{color:#AFC0E4;padding-bottom:4px;border-bottom:2px solid transparent}
nav a.on{color:#fff;border-bottom-color:var(--lime)}
.status{margin-left:auto;font-size:12px;color:#AFC0E4}
main{max-width:1280px;margin:0 auto;padding:28px 28px 40px}
h1{font-size:34px;margin:0 0 4px;letter-spacing:-.6px}
h2{font-size:21px;margin:34px 0 14px;letter-spacing:-.2px}
.sub{color:var(--sec);margin:0 0 22px;font-size:16px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px 22px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.warn{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:12px;padding:10px 14px;font-size:13px;margin-top:12px}
.badge{display:inline-block;white-space:nowrap;font-weight:700;font-size:13px;border-radius:999px;padding:3px 10px}
.badge.up{background:var(--upBg);color:var(--up)} .badge.down{background:var(--downBg);color:var(--downText)} .badge.na{background:#F1F5F9;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--navy);font-weight:700;border-radius:12px;padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--navy)}
.seg{display:inline-flex;background:#EEF2F7;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:9px 16px;border-radius:9px;font-weight:700;color:var(--sec);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(15,32,66,.12)}
.toggle{display:inline-flex;background:#EEF2F7;border-radius:10px;padding:3px;gap:2px}
.toggle button{font-size:13px;font-weight:600;border:0;background:transparent;padding:6px 12px;border-radius:8px;color:var(--sec);cursor:pointer}
.toggle button.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(15,32,66,.12)}
.strip{margin-top:26px;background:var(--lime);border-radius:12px;padding:11px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;font-weight:700;color:var(--navy);flex-wrap:wrap}
.strip a{color:var(--navy);font-weight:800}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 20px 30px}

/* ---- тест ---- */
.test-cta{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--blue);color:#fff;border:0}
.test-cta h3{margin:0;font-size:20px}
.test-cta p{margin:4px 0 0;color:#DCE6FF}
.test-cta .btn{background:#fff;border-color:#fff;color:var(--navy)}
.test{margin-top:14px}
.test .head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.prog{height:8px;border-radius:99px;background:#EEF2F7;overflow:hidden;flex:1;min-width:200px}
.prog i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.qgrid{grid-template-columns:1fr}}
.q{border:1px solid var(--border);border-radius:14px;padding:14px}
.q.miss{border-color:#FCA5A5;background:#FFFBFB}
.q h4{margin:0 0 2px;font-size:15px}
.q .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-top:7px;cursor:pointer;font-size:14px}
.opt:hover{border-color:var(--blue)}
.opt input{margin-top:3px;accent-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--soft)}
.opt b{color:var(--blue)}
.res{margin-top:16px;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.res{grid-template-columns:1fr}}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.recs{grid-template-columns:1fr}}
.recs .card{padding:14px 16px}
.recs h4{margin:0 0 6px;font-size:14px}
.recs ul{margin:0;padding-left:18px;font-size:14px}
.recs li{margin:4px 0}

/* ---- часы ---- */
.clockgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:20px;margin-top:20px;align-items:start}
@media(max-width:860px){.clockgrid{grid-template-columns:1fr}}
.clockcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 14px 40px}
.clockcard svg{display:block !important;width:100% !important;max-width:660px;height:auto !important;aspect-ratio:1/1;visibility:visible !important;opacity:1 !important;overflow:visible}
.corner{position:absolute;font-size:14px;font-weight:800;color:var(--blue);line-height:1.25}
.tl{top:20px;left:22px}.tr{top:20px;right:22px;text-align:right}.bl{bottom:20px;left:22px}.br{bottom:20px;right:22px;text-align:right}
.legend{display:flex;gap:16px;font-size:13px;color:var(--sec);justify-content:center;margin-bottom:6px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;vertical-align:-1px;margin-right:6px}
.col{display:flex;flex-direction:column;gap:12px}
.col .card{padding:16px 18px}
.now{background:var(--navy);color:#fff;border:0}
.now .k{font-size:13px;color:#AFC0E4;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.now .t{font-size:34px;font-weight:800;margin:4px 0 0;line-height:1.1}
.now .p{font-size:16px;font-weight:700;color:#C9D7FF;line-height:1.3}
.now .upd{display:inline-block;margin-top:10px;background:#16295A;border-radius:999px;padding:4px 12px;font-size:12px;color:#C9D7FF}
.now ul{margin:12px 0 0;padding:10px 12px 10px 26px;background:#16295A;border-radius:12px;font-size:13.5px;line-height:1.4}
.now li{margin:3px 0}
.ex{background:#FFF7ED;color:#9A3412;border-radius:999px;padding:2px 10px;font-size:12px}
.ph h3{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:6px}
.ph p{margin:0 0 10px;color:var(--sec);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:700;border-radius:9px;padding:6px 10px;white-space:nowrap}
.chip.g{background:var(--upBg);color:var(--up)} .chip.r{background:var(--downBg);color:var(--downText)} .chip.b{background:var(--blueBg);color:var(--blue)}
.chip.off{opacity:.65}
details.how{margin-top:4px}
details.how summary{cursor:pointer;font-weight:700;color:var(--blue);font-size:14px}
details.how ol{margin:10px 0 0;padding-left:20px;font-size:14px;color:var(--sec)}
details.how li{margin:5px 0} details.how li b{color:var(--navy)}
/* главная — вариант C */
.nowL{border-left:4px solid var(--blue)}
.nowL .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.nowL .ex{background:#FFF7ED;color:#C2410C;border-radius:6px;padding:1px 6px;margin-left:4px}
.nowL .row{display:flex;align-items:baseline;gap:12px;margin:6px 0 0;flex-wrap:wrap}
.nowL .t{font-size:28px;font-weight:700;color:var(--blue);line-height:1}
.nowL .p{font-size:16px;font-weight:700}
.nowL .d{font-size:13px;color:var(--sec);margin-top:3px}
.nowL ul{margin:12px 0 0;padding-left:18px;font-size:14px;line-height:1.45}
.nowL li{margin:3px 0}
.nowL details.how{margin-top:10px} .nowL details.how summary{font-size:13px;font-weight:600}
.phases{margin-top:12px}
.phases .line{padding:12px 0;border-top:1px solid var(--border)}
.phases .line:first-child{border-top:0;padding-top:2px} .phases .line:last-child{padding-bottom:2px}
.phases h4{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phases h4 span{font-weight:500;color:var(--sec);font-size:13px}
.phases i.sq{width:10px;height:10px;border-radius:3px;display:inline-block}
.clockcard .corner{font-size:12px;font-weight:700}


/* ---- таблицы ---- */
.tbl{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
th{font-weight:700;color:var(--sec);background:#F8FAFC;position:sticky;top:0}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{background:#F8FAFC;z-index:2}
.fin td:first-child{min-width:260px;white-space:normal}
.wrapth th{white-space:normal;vertical-align:bottom;min-width:84px}
tr.grp td{background:var(--soft);font-weight:800;color:var(--navy);text-align:left}
tr.sub td:first-child{color:var(--muted);padding-left:26px}
td.ltm,th.ltm{background:#F5F8FF}
td.neg{color:var(--downText)}
td.avg,th.avg{background:#FBFCE9}
td.lo{background:#DCFCE7 !important;color:#14532D} td.hi{background:#FEE2E2 !important;color:#7F1D1D} td.nm{color:var(--muted)}
tr.off td{color:#94A3B8 !important} tr.off td:first-child{color:#94A3B8}
tr.link{cursor:pointer} tr.link:hover td{background:var(--soft)}
tr.total td{font-weight:800;background:#FBFCE9}
.soon{font-size:11px;font-weight:700;color:var(--muted);background:#F1F5F9;border-radius:6px;padding:2px 7px;margin-left:8px}
.go{font-size:11px;font-weight:700;color:var(--blue);background:#EAF0FF;border-radius:6px;padding:2px 7px;margin-left:8px}
.light{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.l-g{background:#22C55E}.l-r{background:#EF4444}.l-y{background:#F59E0B}.l-s{background:#CBD5E1}
td.c-g{background:#F0FDF4} td.c-r{background:#FEF2F2} td.c-y{background:#FFFBEB}
.rcard{margin-top:6px}
.rcard .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rcard .top b{font-size:20px}
.rcard .vd{color:var(--sec);font-size:14px;flex-basis:100%}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.m{border-radius:12px;padding:12px 14px;border:1px solid var(--border)}
.m span{display:block;font-size:12px;color:var(--muted)} .m b{font-size:20px;font-weight:800} .m p{margin:4px 0 0;font-size:13px;color:var(--sec)}
.m.g{background:#F0FDF4;border-color:#BBF7D0} .m.r{background:#FEF2F2;border-color:#FECACA} .m.y{background:#FFFBEB;border-color:#FDE68A}
.verdict{white-space:normal;min-width:280px;max-width:420px;text-align:left;color:var(--sec);font-size:13px}

/* ---- банки / компании ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.tile span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.tile b{font-size:21px;font-weight:800}
.tile.hl{background:var(--blue);border-color:var(--blue);color:#fff} .tile.hl span{color:#C9D7FF}
.tile.hl a{display:block;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:700;color:#fff}
.bankbtns{display:flex;flex-wrap:wrap;gap:10px}
.bankbtns .btn{padding:11px 18px}
.bankbtns .btn small{font-size:11px;color:var(--muted);font-weight:700}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 14px}
.sec-head h2{margin:0}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.csel{width:100%;margin-bottom:12px;font-weight:700;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--soft);color:var(--navy)}
.chart-wrap{position:relative;height:270px}
.fc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.fc{grid-template-columns:1fr}}
.fc td:first-child{white-space:normal;min-width:0}
.fc th{white-space:normal}
.fc td,.fc th{padding:8px 10px}
.fc h3{margin:0 0 4px;font-size:16px}
.fc .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.final{margin-top:16px;display:flex;gap:16px;flex-wrap:wrap}
.final .big{flex:1;min-width:240px;background:var(--navy);color:#fff;border-radius:16px;padding:18px 20px}
.final .big .lbl{font-size:12px;color:#AFC0E4;display:block}
.final .big b{font-size:28px;font-weight:800;margin-right:8px}
.clubbar{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.clubbar .btn{padding:12px 18px}
.legend2{display:flex;gap:16px;font-size:12px;color:var(--sec);margin-top:8px;flex-wrap:wrap}
.legend2 i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.compact{width:fit-content;max-width:100%}
.compact table{width:auto}
.compact th,.compact td{padding:7px 12px}
.compact td:first-child,.compact th:first-child{white-space:normal;width:190px;min-width:150px;max-width:190px}
.cm{white-space:normal;text-align:left;color:var(--muted);font-size:12px;min-width:220px;max-width:360px}
.dv{display:block;font-size:10px;font-weight:800;color:var(--up)}
select.inl{font:inherit;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--navy)}

/* таблицы: тёмная шапка, чередование строк, подсветка лучше/хуже среднего */
.tbl thead th{background:var(--navy) !important;color:#fff !important;border-bottom:0}
.tbl tbody tr:nth-child(even)>td{background:#EEF3FF}
.tbl tbody tr:nth-child(odd)>td{background:#FFFFFF}
.tbl tbody tr.grp>td{background:#DCE6FF !important}
.tbl tbody tr.total>td{background:#FBFCE9 !important}
.tbl tbody tr.link:hover>td{background:#DCE6FF}
.tbl td.gd{background:#DCFCE7 !important;color:#14532D;font-weight:700}
.tbl td.bd{background:#FEE2E2 !important;color:#7F1D1D;font-weight:700}
.tbl td.c-g{background:#DCFCE7 !important} .tbl td.c-r{background:#FEE2E2 !important} .tbl td.c-y{background:#FEF3C7 !important}
.tbl td.lo{background:#DCFCE7 !important} .tbl td.hi{background:#FEE2E2 !important}
.tbl td.avg{background:#F7F9E3 !important}

/* РСБУ: компактные таблицы, заголовки в 2 строки */
.rsbu{width:fit-content;max-width:100%}
.rsbu table{width:auto}
.rsbu thead th{white-space:nowrap;line-height:1.25;vertical-align:bottom;padding:8px 7px;font-size:11.5px}
.rsbu thead th:first-child{max-width:none}
.rsbu td{padding:7px 7px}
.rsbu td:first-child{white-space:normal;min-width:88px;max-width:104px;width:104px;line-height:1.25;font-size:12.5px}
.rsbu td:first-child small{display:block;margin-top:1px}
.rsbu .verdict{min-width:180px;max-width:220px;font-size:12px;line-height:1.35}

/* большие экраны */
@media(min-width:1500px){
  .bar,main{max-width:1520px}
  body{font-size:16px}
  .clockgrid{grid-template-columns:minmax(0,1.45fr) minmax(380px,1fr);gap:24px}
  .clockcard svg{max-width:780px}
  .nowL .t{font-size:32px} .nowL .p{font-size:17px} .nowL ul{font-size:15px}
  .phases h4{font-size:15px} .chip{font-size:14px;padding:7px 12px}
  h1{font-size:40px} .sub{font-size:17px}
  .col{gap:16px}
}
@media(min-width:1900px){
  .bar,main{max-width:1760px}
  .clockcard svg{max-width:880px}
}
</style>
</head>

// Кнопки банков (порядок — как во вкладке «риск»). sheet — лист в таблице «Банковский сектор», rsbu — имя в РСБУ.

const EXCLUDE_FROM_AVG = ["МКБ"];
// Небанковские отрасли: какие листы — какие компании (ticker для подписи, review — ссылка на разбор в клубе)
const SECTORS = {
  telecom:{name:"Телекомы", companies:[
    {id:"rtkm", short:"Ростелеком", sheet:"Ростелеком", ticker:"RTKM", review:""},
    {id:"mtss", short:"МТС",        sheet:"МТС",        ticker:"MTSS", review:""}]}
};
// Фазы на часах: с какого по какой час, отрасли (id из каталога) — согласовать
const PHASES = [
  {id:"peak",     name:"Бум / Пик",      from:9,  to:12, sectors:["metals","oilgas","fertilizers","industry","transport"]},
  {id:"slowdown", name:"Замедление",     from:12, to:15, sectors:["gold","consumer","power","telecom"]},

const ANSWER_HOUR = {A:7.5, B:10.5, C:1.5, D:4.5};   // ответ теста → середина фазы на циферблате
/* ============================================ */

const EMBED = /*EMBED*/null;
let D = {catalog:null, sectors:{}, rsbu:null, clock:null, test:null};
const charts=[];

/* ---------- утилиты ---------- */
const nf=d=>new Intl.NumberFormat("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});
const isNum=v=>typeof v==="number"&&isFinite(v);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(v,kind){
  if(!isNum(v)) return (v===""||v==null||/^#(VALUE|DIV|N\/A|REF|NAME|NUM|NULL|ERROR)/i.test(String(v)))?"—":esc(v);
  if(kind==="pct") return nf(1).format(v*100)+"%";
  if(kind==="pp") return nf(1).format(v)+"%";
  const a=Math.abs(v); return nf(a>=1000?0:a>=100?1:2).format(v);
}
const rub=v=>isNum(v)?fmt(v)+" ₽":"—";
const pctBadge=v=>!isNum(v)||v<=-0.999?`<span class="badge na">н/д</span>`:`<span class="badge ${v>=0?"up":"down"}">${v>=0?"+":""}${nf(1).format(v*100)}%</span>`;
const norm=s=>String(s??"").trim().toLowerCase().replace(/р/g,"p").replace(/е/g,"e").replace(/в/g,"b").replace(/\s+/g," ");
const isPctLabel=l=>/темп|рентаб|\/ ?прибыль|\/ ?fcf|%|апсайд|^roe|^roa|cost of risk|маржа|npl|ratio|норматив|доля|доходность|cir|покрытие/i.test(l);
function hourLabel(h){ h=((h%12)+12)%12; let H=Math.floor(h), M=Math.round((h-H)*60/15)*15; if(M===60){H+=1;M=0;} if(H===0)H=12; return H+":"+String(M).padStart(2,"0"); }

/* ---------- инвест-часы ---------- */
function phaseOf(h){ const x=((h%12)+12)%12; const hh=x<9? x+12 : x; return PHASES.find(p=>hh>=p.from&&hh<p.to)||PHASES[0]; }
function phaseIdx(p){ return PHASES.indexOf(p); }
function clockFromAnswers(ans){
  let x=0,y=0,n=0;
  ans.forEach(a=>{ if(!ANSWER_HOUR[a]) return; const t=(ANSWER_HOUR[a]/12)*2*Math.PI; x+=Math.sin(t); y+=Math.cos(t); n++; });
  if(!n) return null;
  let t=Math.atan2(x,y); if(t<0) t+=2*Math.PI;
  const hour=t/(2*Math.PI)*12, strength=Math.sqrt(x*x+y*y)/n;
  const score=ans.reduce((s,a)=>s+(D.test.SCORE[a]??0),0);
  const band=score>=23?"recovery":score>=16?"peak":score>=8?"slowdown":"recession";
  return {hour, strength, score, band, phase:phaseOf(hour)};
}
// общие часы: время из теста, либо выставленное вручную в таблице (поле «Время вручную»)
function sharedClock(){
  const ck=D.clock; if(!ck) return null;
  const r=clockFromAnswers(ck.answers||[]);
  if(isNum(ck.hour)){ const p=phaseOf(ck.hour); return Object.assign(r||{}, {hour:ck.hour, phase:p}); }
  return r;
}
// переносим fill/stroke в style — так чужие стили сайта (например, GetCourse) не перекрасят картинку
function inlinePaint(svg){
  return svg.replace(/<(path|line|circle|rect|text)\b([^>]*?)(\/?)>/g,(m,tag,attrs,self)=>{
    const st=[]; attrs=attrs.replace(/\s(fill|stroke|stroke-width|stroke-linecap|stroke-dasharray|font-size|font-weight|paint-order|letter-spacing)="([^"]*)"/g,(x,k,v)=>{st.push(k+":"+v+(/^(stroke-width|font-size|letter-spacing)$/.test(k)&&/^[\d.]+$/.test(v)?"px":"")); return x;});
    if(!/fill:/.test(st.join(";"))&&tag!=="line") st.push("fill:none");
    return `<${tag}${attrs} style="${st.join(";")}"${self}>`;
  });
}
function clockSVG(hour, size, opts={}){
  const S=size, cx=S/2, cy=S/2, R=S*0.36;
  const pt=(h,r)=>{const a=(h*30-90)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]};
  const cur=phaseOf(hour), ci=phaseIdx(cur), next=PHASES[(ci+1)%4], prev=PHASES[(ci+3)%4];
  const st=p=>p===cur?"now":p===next?"next":p===prev?"prev":"far";
  const fill={now:"#E3EBFF",next:"#E3F9EA",prev:"#FDE8E8",far:"#F1F5F9"};
  const tagD={now:["сейчас","#1F5CFF","#FFFFFF"],next:["следующая","#BBF7D0","#15803D"],prev:["прошлая","#FECACA","#B91C1C"]};
  const sector=(h1,h2,r)=>{const [x1,y1]=pt(h1,r),[x2,y2]=pt(h2,r); return `M${cx},${cy} L${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2} Z`};
  let s=`<svg viewBox="0 0 ${S} ${S}" width="${opts.w||S}" xmlns="http://www.w3.org/2000/svg" font-family="Manrope, Arial, sans-serif">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R+S*0.045}" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>`;
  PHASES.forEach(p=>{ s+=`<path d="${sector(p.from,p.to,R)}" fill="${fill[st(p)]}" stroke="#FFFFFF" stroke-width="${Math.max(2,S/170)}"/>`; });
  s+=`<path d="${sector(cur.from,cur.to,R)}" fill="none" stroke="#1F5CFF" stroke-width="2.5" stroke-linejoin="round"/>`;
  for(let m=0;m<60;m++){ const h=m/5, big=m%5===0; const [x1,y1]=pt(h,R+S*(big?0.012:0.022)),[x2,y2]=pt(h,R+S*0.034);
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${big?"#0F2042":"#CBD5E1"}" stroke-width="${big?2:1}" stroke-linecap="round"/>`; }
  for(let h=1;h<=12;h++){ const [x,y]=pt(h,R+S*0.075);
    s+=`<text x="${x}" y="${y+S*0.011}" text-anchor="middle" font-size="${S*0.031}" font-weight="${h%3?500:700}" fill="${h%3?"#475569":"#0F2042"}">${h}</text>`; }
  const hand=(hr,len,col,w,dash)=>{const [hx,hy]=pt(hr,len),[bx,by]=pt(hr+6,R*0.08); return `<line x1="${bx}" y1="${by}" x2="${hx}" y2="${hy}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${dash?` stroke-dasharray="${dash}"`:""}/>`;};
  if(opts.second!=null) s+=hand(opts.second,R*0.62,"#1F5CFF",S*0.009,`${S*0.02} ${S*0.012}`);
  s+=hand(hour,opts.labels===false?R*0.7:R*0.4,"#0F2042",S*0.012);
  if(opts.labels!==false){
    PHASES.forEach(p=>{
      const k=st(p), list=p.sectors.map(id=>secName(id)), [x,y]=pt((p.from+p.to)/2,R*0.6), lh=S*0.033, y0=y-(list.length*lh+S*0.04)/2+S*0.01;
      if(tagD[k]){ const [t,bg,fg]=tagD[k], tw=t.length*S*0.0115+S*0.03;
        s+=`<rect x="${x-tw/2}" y="${y0-S*0.058}" width="${tw}" height="${S*0.03}" rx="${S*0.015}" fill="${bg}"/><text x="${x}" y="${y0-S*0.0375}" text-anchor="middle" font-size="${S*0.0175}" font-weight="700" fill="${fg}">${t}</text>`; }
      s+=`<text x="${x}" y="${y0}" text-anchor="middle" font-size="${S*0.022}" font-weight="700" letter-spacing="0.6" fill="#0F2042" stroke="${fill[k]}" stroke-width="5" paint-order="stroke">${p.name.toUpperCase()}</text>`;
      list.forEach((t,i)=>{ s+=`<text x="${x}" y="${y0+S*0.04+i*lh}" text-anchor="middle" font-size="${S*0.0205}" font-weight="500" fill="#475569" stroke="${fill[k]}" stroke-width="4" paint-order="stroke">${esc(t)}</text>`; });
    });
  }
  s+=`<circle cx="${cx}" cy="${cy}" r="${S*0.02}" fill="#0F2042"/><circle cx="${cx}" cy="${cy}" r="${S*0.008}" fill="#B6F03A"/></svg>`;
  return inlinePaint(s);
}
function secName(id){ const s=(D.catalog?.sectors||[]).find(x=>x.id===id); return s?s.name.replace("Банковский сектор","Банки").replace("Потребительский сектор","Потреб сектор").replace("Сетевые компании","Сетевые"):id; }

/* ---------- разбор листа компании / банка (по подписям строк) ---------- */
function parseCompany(grid){
  const head=grid[0]||[], cols=[];
  for(let c=2;c<head.length;c++){
    const h=head[c]; if(h===""||h==null){ if(cols.length) break; else continue; }
    if(/коммент/i.test(String(h))) break;
    const label=isNum(h)?String(Math.round(h)):String(h).trim();
    const kind=/^\d{4}$/.test(label)?"year":/^ltm$/i.test(label)?"ltm":(/прогноз|п$|^п\d{4}/i.test(label))?"fc":"q";
    cols.push({c,label,kind});
  }
  const L=r=>String((grid[r]||[])[0]??"").trim();
  let multRow=grid.findIndex(r=>norm(r[0])===norm("мультипликаторы")), fcRow=grid.findIndex(r=>norm(r[0])===norm("мультипликаторный прогноз"));
  if(multRow<0) multRow=grid.length; if(fcRow<0) fcRow=grid.length;
  const blocks=[]; let cur=null;
  for(let r=1;r<multRow;r++){ const l=L(r); if(!l||isNum(grid[r][0])){cur=null;continue}
    if(!cur){cur={rows:[]};blocks.push(cur)}
    cur.rows.push({label:l,pct:isPctLabel(l),sub:/^темп|^юридическ|^физическ|^в том числе|^доля/i.test(l),vals:cols.map(k=>grid[r][k.c])}); }
  const title=b=>{ const s=b.rows.map(r=>r.label.toLowerCase()).join("|");
    if(/выручка/.test(s)) return "Финансовые результаты";
    if(/процентные доходы/.test(s)) return "Доходы и прибыль";
    if(/дивиденд/.test(s)) return "Дивиденды";
    if(/денежный поток|fcf/.test(s)) return "Денежный поток";
    if(/(^|\|)roe|cost of risk|npl|процентная маржа/.test(s)) return "Эффективность и качество кредитов";
    if(/норматив/.test(s)) return "Достаточность капитала";
    if(/капитализ|цена акции/.test(s)) return "Рынок";
    if(/актив|капитал|долг|кредитный портфель|депозит/.test(s)) return "Баланс";
    return "Операционные показатели"; };
  blocks.forEach(b=>b.title=title(b));
  const mult=[];
  for(let r=multRow+1;r<fcRow&&r<grid.length;r++){ const l=L(r); if(!l) break; mult.push({label:l,avg:grid[r][1],vals:cols.map(k=>grid[r][k.c])}); }
  const fc=[]; let final=null;
  for(let r=fcRow+1;r<grid.length;r++){
    const row=grid[r]||[], l=norm(row[0]);
    if(["p/e","ev/ebitda","p/b"].includes(l) && ((typeof row[1]==="string" && row[1].trim())||(typeof row[2]==="string" && row[2].trim()))){
      const blk={method:String(row[0]).trim(),h1:String(row[1]).trim(),h2:String(row[2]??"").trim(),rows:[]};
      const isHead=k=>["p/e","ev/ebitda","p/b"].includes(norm((grid[k]||[])[0]));
      for(let k=r+1;k<grid.length;k++){ if(!L(k)){ const nx=grid[k+1]||[]; if(L(k+1)&&!isHead(k+1)&&(isNum(nx[1])||isNum(nx[2]))) continue; break; } if(/^комментари/i.test(L(k))) break; if(isHead(k)) break; blk.rows.push({label:L(k),v1:grid[k][1],v2:grid[k][2]}); }
      fc.push(blk);
    }
  }
  // итоговая справедливая стоимость: первая строка «апсайд» правее столбца A после блока прогноза
  if(fcRow<grid.length){
    let it=null; for(let r=fcRow;r<grid.length&&!it;r++){ const c=(grid[r]||[]).findIndex(v=>norm(v)===norm("итоговая сс")); if(c>=0) it={r,c}; }
    for(let r=fcRow+1;r<grid.length;r++){
      const row=grid[r]||[], ca=row.findIndex((v,i)=>i>=3&&norm(v)===norm("апсайд"));
      if(ca>=0&&isNum(row[ca+1])){
        const vr=grid[r-1]||[], isLbl=x=>typeof x==="string"&&x.trim()!==""; let hr=it?grid[it.r+1]||[]:grid[r-2]||[], hc=it?it.c:ca+1;
        if(!it&&!isLbl(hr[hc])&&isLbl((grid[r+1]||[])[hc])) hr=grid[r+1];
        final={labels:[hr[hc],hr[hc+1]].map(x=>String(x??"").trim()),values:[vr[ca+1],vr[ca+2]],upside:[row[ca+1],row[ca+2]]};
        break;
      }
    }
    // запасной формат (Дом РФ): «Целевая цена*» в столбце A, под ней строка значений и «апсайд»
    if(!final) for(let r=fcRow+1;r<grid.length-2;r++){
      const h=grid[r]||[], v=grid[r+1]||[], u=grid[r+2]||[];
      if(/^целевая цена\s*\*?\s*$/i.test(String(h[0]??"").trim()) && typeof h[1]==="string" && h[1].trim() && isNum(v[1]) && norm(u[0])===norm("апсайд")){
        final={labels:[h[1],h[2]].map(x=>String(x??"").trim()),values:[v[1],v[2]],upside:[u[1],u[2]]}; break;
      }
    }
  }
  return {cols,blocks,mult,fc,final};
}
const findRow=(p,re)=>{for(const b of p.blocks) for(const r of b.rows) if(re.test(r.label)) return r; return null;};
const ltmIdx=p=>p.cols.findIndex(c=>c.kind==="ltm");
const ltm=(p,row)=>{const i=ltmIdx(p); return row&&i>=0?row.vals[i]:null;};
const multRow=(p,re)=>p.mult.find(m=>re.test(norm(m.label)));
const multLtm=(p,re)=>{const r=multRow(p,re); return r?ltm(p,r):null;};
function finalUp(f){ if(!f) return null; for(let i=f.values.length-1;i>=0;i--) if(isNum(f.values[i])&&f.values[i]>0) return f.upside[i]; return null; }

function bankSummary(b){
  const g=D.sectors.banks?.sheets?.[b.sheet]; if(!g) return null;
  const p=parseCompany(g);
  const price=ltm(p,findRow(p,/^цена акции/i)), dps=ltm(p,findRow(p,/^дивиденды на акцию/i));

function bankAverages(){
  const g=D.sectors.banks?.sheets?.["средние"]; if(!g) return null;
  const h=g.findIndex(r=>r.some(v=>norm(v)===norm("Капитализация"))); if(h<0) return null;
  const head=g[h].map(norm), ci=n=>head.findIndex(x=>x===norm(n));
  const rows=[];
  for(let r=h+1;r<g.length;r++){ const nm=String(g[r][0]??"").trim(); if(!nm) break;
    rows.push({name:nm, cap:g[r][ci("Капитализация")], roe:g[r][ci("ROE")], roa:g[r][ci("ROA")], pb:g[r][ci("P/B")], pe:g[r][ci("Р/Е")],
      avgRow:/^среднее/i.test(nm), excluded:EXCLUDE_FROM_AVG.includes(nm), note:String(g[r][6]??"")}); }
  const use=rows.filter(r=>!r.avgRow&&!r.excluded);
  const avg=k=>{const v=use.map(r=>r[k]).filter(isNum); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null;};
  const dys=BANKS.map(b=>bankSummary(b)?.dy).filter(isNum);
  return {rows, n:use.length, pe:avg("pe"), pb:avg("pb"), roe:avg("roe"), roa:avg("roa"), dy:dys.length?dys.reduce((a,b)=>a+b,0)/dys.length:null};
}

function riskTable(){
  const g=D.sectors.banks?.sheets?.["риск"]; if(!g) return "";
  const h=g.findIndex(r=>String(r[1]??"").trim()==="Сбер"); if(h<0) return "";

  const rows=[]; for(let r=h+1;r<g.length;r++){ const l=String(g[r][0]??"").trim(); if(!l||l.startsWith("@")) break; rows.push(r); }
  const cap=t=>/^[pр]\/[eеbв]$/i.test(t)?t.toUpperCase().replace("Р","P").replace("Е","E").replace("В","B"):t.charAt(0).toUpperCase()+t.slice(1);
  // направление: больше — лучше (+1) или меньше — лучше (-1)
  const dir=l=>/риск/i.test(l)?-1:/^[pр]\/[eеbв]/i.test(l)?-1:/маржа|рентаб|roe|норматив|достаточн/i.test(l)?1:0;
  const body=rows.map(r=>{const l=String(g[r][0]).trim(), pct=/маржа|риск|рентаб|норматив|достаточн/i.test(l), d=dir(l);
    const vals=names.map((n,i)=>g[r][i+1]), nums=vals.filter(isNum), avg=nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null;
    const cls=v=>!d||!isNum(v)||!isNum(avg)?"":(v-avg)*d>avg*0.03?"gd":(avg-v)*d>avg*0.03?"bd":"";
    return `<tr><td>${esc(cap(l))}</td>${vals.map(v=>`<td class="${cls(v)}">${fmt(v,pct?"pct":"")}</td>`).join("")}</tr>`}).join("");
  return `<div class="tbl compact"><table><thead><tr><th>Показатель</th>${names.map(n=>`<th>${esc(n)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend2"><span><i style="background:#DCFCE7"></i>лучше среднего по банкам</span><span><i style="background:#FEE2E2"></i>хуже среднего</span><span>для P/E и P/B зелёный — дешевле среднего</span></div>`;
}
function multTableBanks(A){

  const c=(v,avg,d,r)=>r.excluded||!isNum(v)||!isNum(avg)?"":(v-avg)*d>Math.abs(avg)*0.03?"gd":(avg-v)*d>Math.abs(avg)*0.03?"bd":"";

}

function tableHTML(p,mode){
  const cols=p.cols.map((c,i)=>i).filter(i=>mode==="all"||(mode==="year"?p.cols[i].kind!=="q":p.cols[i].kind!=="year"));
  const th=cols.map(i=>`<th class="${p.cols[i].kind==="ltm"?"ltm":""}">${esc(p.cols[i].label)}</th>`).join("");
  const body=p.blocks.map(b=>`<tr class="grp"><td colspan="${cols.length+1}">${b.title}</td></tr>`+b.rows.map(r=>`<tr class="${r.sub?"sub":""}"><td>${esc(r.label)}</td>${cols.map(i=>{const v=r.vals[i];return `<td class="${p.cols[i].kind==="ltm"?"ltm":""} ${isNum(v)&&v<0?"neg":""}">${fmt(v,r.pct?"pct":"")}</td>`}).join("")}</tr>`).join("")).join("");
  return `<div class="tbl fin"><table><thead><tr><th>Показатель</th>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function multHTML(p,mode){
  const cols=p.cols.map((c,i)=>i).filter(i=>mode==="all"||(mode==="year"?p.cols[i].kind!=="q":p.cols[i].kind!=="year"));
  const th=cols.map(i=>`<th class="${p.cols[i].kind==="ltm"?"ltm":""}">${esc(p.cols[i].label)}</th>`).join("");
  const body=p.mult.map(m=>{const debt=/^долг/.test(norm(m.label)), cls=v=>!isNum(v)||!isNum(m.avg)?"":(v<0&&!debt)?"nm":v<m.avg?"lo":v>m.avg?"hi":"";
    return `<tr><td>${esc(m.label)}</td><td class="avg"><b>${fmt(m.avg)}</b></td>${cols.map(i=>`<td class="${p.cols[i].kind==="ltm"?"ltm":""} ${cls(m.vals[i])}">${fmt(m.vals[i])}</td>`).join("")}</tr>`}).join("");
  return `<div class="tbl fin"><table><thead><tr><th>Мультипликатор</th><th class="avg">Среднее</th>${th}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend2"><span><i style="background:#DCFCE7"></i>ниже своего среднего — дешевле истории</span><span><i style="background:#FEE2E2"></i>выше среднего — дороже истории</span><span><i style="background:#F1F5F9"></i>серым — отрицательный (убыток), не сравнивается</span></div>`;
}
function fcHTML(p,price){
  if(!p.fc.length) return `<p class="note">На листе нет блока «Мультипликаторный прогноз».</p>`;
  const nm={"p/e":"По P/E (цена / прибыль)","ev/ebitda":"По EV/EBITDA","p/b":"По P/B (цена / капитал)"};
  const cards=p.fc.map(b=>{const cnt={};
    const rows=b.rows.map(r=>{let l=r.label; const m=l.match(/^целевая цена\s*(\d)?\s*(\(.+\))?/i);
      if(m){const suf=m[2]||""; cnt[suf]=(cnt[suf]||0)+1; l=`Целевая цена ${suf} · ${cnt[suf]===1?"по среднему мультипликатору компании":"по среднеотраслевому мультипликатору"}`;}
      const up=/^апсайд/i.test(r.label), tp=/^целевая цена/i.test(r.label);
      const cell=v=>up?pctBadge(v):tp?(isNum(v)&&v>0?`<b>${rub(v)}</b>`:`<span class="badge na">н/д</span>`):fmt(v);
      return `<tr><td>${esc(l)}</td><td>${cell(r.v1)}</td><td>${cell(r.v2)}</td></tr>`}).join("");
    return `<div class="card"><h3>${nm[norm(b.method)]||esc(b.method)}</h3><p class="hint">Сценарии: «${esc(b.h1)}» и «${esc(b.h2)}»</p><div class="tbl" style="border:0"><table><thead><tr><th></th><th>${esc(b.h1)}</th><th>${esc(b.h2)}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}).join("");
  const f=p.final;
  const fin=f?`<div class="final">${f.labels.map((l,i)=>`<div class="big"><span class="lbl">Итоговая справедливая стоимость · ${esc(l)}</span><b>${isNum(f.values[i])&&f.values[i]>0?rub(f.values[i]):"н/д"}</b>${pctBadge(f.upside[i])}</div>`).join("")}<div class="tile"><span>Текущая цена</span><b>${rub(price)}</b></div></div>`:"";
  return `<div class="fc">${cards}</div>${fin}`;
}
const BANK_CHARTS=[

const PAL=["#1F5CFF","#0F2042","#94A3B8","#15803D"];
function bankChart(p,kind){
  const yi=p.cols.map((c,i)=>i).filter(i=>p.cols[i].kind==="year"||p.cols[i].kind==="ltm"), labels=yi.map(i=>p.cols[i].label);
  const pick=r=>yi.map(i=>r&&isNum(r.vals[i])?r.vals[i]:null), ser=re=>pick(findRow(p,re));
  const mser=re=>{const r=multRow(p,re); return yi.map(i=>r&&isNum(r.vals[i])&&Math.abs(r.vals[i])<60?r.vals[i]:null)};
  const grid={color:"#E2E8F0"}, legend={position:"bottom",labels:{boxWidth:12}}, pctT={callback:v=>nf(1).format(v*100)+"%"};
  const bar=(l,d,i)=>({label:l,data:d,backgroundColor:PAL[i],borderRadius:4}), line=(l,d,i)=>({label:l,data:d,borderColor:PAL[i],backgroundColor:PAL[i],tension:.3,spanGaps:true,pointRadius:3});
  const base=(type,ds,pct)=>({type,data:{labels,datasets:ds},options:{maintainAspectRatio:false,plugins:{legend,tooltip:pct?{callbacks:{label:c=>c.dataset.label+": "+fmt(c.parsed.y,"pct")}}:{}},scales:{x:{grid:{display:false}},y:{grid,ticks:pct?pctT:{}}}}});
  if(kind==="inc") return base("bar",[bar("Чистые процентные доходы",ser(/^чистые процентные доходы/i),0),bar("Чистые комиссионные доходы",ser(/^чистые комиссионные/i),1),bar("Прибыль",ser(/^(чистая )?прибыль/i),2)]);
  if(kind==="bal") return base("bar",[bar("Кредитный портфель",ser(/^кредитный портфель/i),0),bar("Депозиты",ser(/^депозиты/i),1)]);
  if(kind==="roe") return base("line",[line("ROE",ser(/^roe$/i),0),line("ROA",ser(/^roa$/i),1)],true);
  if(kind==="qual") return base("line",[line("Просрочка (NPL)",ser(/^просроченные/i),0),line("Стоимость риска",ser(/^cost of risk/i),1)],true);
  if(kind==="nim") return base("line",[line("Чистая процентная маржа",ser(/процентная маржа/i),0)],true);
  return base("line",[line("P/E",mser(/^p\/e$/),0),line("P/BV",mser(/^p\/bv?$/),1)]);
}

  if(h==="home") renderHome();
  else if(h==="sectors") renderSectors();
  else if(h==="banks") renderBanks("overview");
  else if(h.startsWith("banks-rsbu")) renderBanks("rsbu", h.slice("banks-rsbu-".length)||null);
  else if(h.startsWith("bank-")){ const b=BANKS.find(x=>x.id===h.slice(5)); b?renderBank(b):renderSectors(); }
  else if(SECTORS[h]) renderSector(h);
  else if(SECTORS[h.split("-")[0]]){ const sid=h.split("-")[0], co=SECTORS[sid].companies.find(x=>x.id===h.slice(sid.length+1)); co?renderCompany(sid,co):renderSector(sid); }
  else if(h==="club") location.hash="home";
  else if(false) document.getElementById("app").innerHTML=`<h1>Клуб Инвест Привет+</h1><p class="sub">Разборы компаний, портфель и обучение.</p>${CLUB_URL?`<a class="btn lime" href="${CLUB_URL}">Перейти в клуб →</a>`:'<p class="note">Ссылка на клуб появится здесь.</p>'}`;
  else renderSectors();
  window.scrollTo(0,0);
}

async function getJSON(name){
  try{ const r=await fetch(DATA_URL+name+"?v="+Date.now()); if(r.ok) return await r.json(); }catch(e){}
  return null;
}
async function load(){
  if(EMBED){ D=EMBED; renameCells(D.sectors&&D.sectors.banks); }
  else{
    const [catalog,banks,rsbu,clock,test]=await Promise.all([getJSON("catalog.json"),getJSON("sectors/banks.json"),getJSON("rsbu.json"),getJSON("clock.json"),getJSON("test.json")]);
    renameCells(banks); D={catalog,sectors:{banks},rsbu,clock,test};
    const extra=(catalog?.sectors||[]).filter(x=>x.active&&SECTORS[x.id]);
    (await Promise.all(extra.map(x=>getJSON("sectors/"+x.id+".json")))).forEach((j,i)=>{ if(j) D.sectors[extra[i].id]=j; });
  }
  const u=D.catalog?.updated? new Date(D.catalog.updated).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
  document.getElementById("status").textContent=u? "данные обновлены "+u : "";
  window.addEventListener("hashchange",route); route();
}
load();
</script>
