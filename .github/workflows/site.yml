name: site-data
# Сайт «Инвест Привет+» (папка docs/): раз в 15 минут собирает JSON из Google-таблиц и РСБУ (data/*.csv)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: write
concurrency: { group: site-data, cancel-in-progress: false }

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r site/requirements.txt
      - name: Собрать JSON
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python site/build_data.py --out docs/data --rsbu-local data
      - name: Опубликовать, если данные изменились
        run: |
          git config user.name "ip-site bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -qm "Сайт: обновление данных $(date -u +'%F %H:%M') UTC"
          git pull -q --rebase origin main
          git push
