name: probe-cbr
on:
  workflow_dispatch:
  push:
    paths: ["scripts/probe.py", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq unar
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests dbfread
      - run: python scripts/probe.py | tee probe.log
