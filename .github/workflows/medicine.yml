name: Medicine data
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/medicine.yml']
permissions:
  contents: write
concurrency: {group: medicine-data, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q -r site/requirements.txt
      - name: Read medicine sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: python
        run: |
          import os, sys, datetime as dt
          from pathlib import Path
          sys.path.insert(0, 'site')
          from build_data import SheetsSource, ExportSource, write_json, pick_sheets
          
          def build_sector(src, sector):
              sid = sector["spreadsheet_id"]
              names = pick_sheets(src.sheet_names(sid), sector.get("sheets", {}))
              grids = src.grids(sid, names)
              if sector.get("metrics_only"):
                  for name, rows in grids.items():
                      if not rows:
                          continue
                      header = rows[0]
                      clean = [[str(v).split(" (")[0] if isinstance(v, str) else v for v in header]]
                      forecast = False
                      for row in rows[1:]:
                          label = row[0] if row else None
                          if not isinstance(label, str) or "комментар" in label.lower():
                              continue
                          if label.strip() == "Мультипликаторный прогноз":
                              forecast = True
                          width = 4 if forecast else len(header)
                          values = [v if isinstance(v, (int, float)) else "" for v in row[1:width]]
                          if forecast and label == "EV/EBITDA":
                              values = [v if v in ("LTM", "П2026") else "" for v in row[1:width]]
                          clean.append([label] + values)
                      for i, row in enumerate(rows[:-2]):
                          if "ИТОГОВАЯ СС" in row:
                              start = row.index("ИТОГОВАЯ СС")
                              totals = rows[i+2][start:start+4]
                              if len(totals) == 4 and isinstance(totals[-1], (int, float)):
                                  clean.append(["Итоговая целевая цена", totals[-1]])
                              break
                      grids[name] = clean
              return {"id": sector["id"], "sheets": grids}
          
          src = SheetsSource() if os.getenv('GOOGLE_SERVICE_ACCOUNT_JSON') else ExportSource()
          config = {"id":"medicine","name":"Медицина","active":True,"spreadsheet_id":"1kMqCKE6dkPxM5_FxvNgSppoP1QGteWuqgqhfcamuiBo","sheets":{"include":["Мать и дитя","ЕМС в евро"]},"metrics_only":True}
          result = build_sector(src, config)
          if any(len(result['sheets'].get(name, [])) < 2 for name in config['sheets']['include']):
              raise ValueError('Incomplete medicine data')
          write_json(Path('docs/data/sectors/medicine.json'), result, dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'))
      - name: Publish medicine only
        run: |
          git add docs/data/sectors/medicine.json
          git diff --cached --quiet && exit 0
          git config user.name 'ip-site bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Обновить данные медицины'
          git pull --rebase origin main
          git push
